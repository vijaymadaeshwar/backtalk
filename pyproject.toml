[project]
name = "backtalk"
version = "1.0.0"
description = "Talk to your opencode agent out loud. Hold a key, speak, and it answers in a real voice."
requires-python = ">=3.11,<3.13"
# The brain is opencode's own local HTTP server (opencode serve), reached
# with the standard library — so there is no agent SDK here to install,
# authenticate, or keep up to date. opencode is the dependency, and it is
# a CLI rather than a package: `npm install -g opencode-ai`.
dependencies = [
    "faster-whisper>=1.0.0",
    "httpx>=0.27.0",
    "kokoro>=0.9.0",
    # misaki is kokoro's G2P layer, and kokoro pulls it in WITHOUT its
    # language extras -- so Japanese and Mandarin are declared here. Without
    # this line a fresh install transcribes fine and then fails at synthesis
    # the first time it tries to speak, which is a miserable way to find out.
    #   ja -> fugashi + unidic (tokenizer and dictionary)
    #   zh -> pypinyin + ordered-set + cn2an (romaniser and number reader)
    "misaki[ja,zh]>=0.9.0",
    # Apple Silicon only: runs the SAME whisper model on the GPU.
    # CTranslate2 (under faster-whisper) has no Metal backend, so
    # without this every Mac transcribes on the CPU. Measured 0.88s
    # -> 0.12s on an M4 Max with an identical transcript. Every other
    # platform keeps faster-whisper, which already uses CUDA.
    "mlx-whisper>=0.4.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=1.26.0",
    "pynput>=1.8.0",
    "setuptools<81",
    "sounddevice>=0.5.0",
    "soundfile>=0.12.0",
    # Windows has no compiler by default and upstream webrtcvad ships an
    # sdist ONLY -- no wheels for any platform -- so uv tries to build it
    # and dies demanding Visual C++ Build Tools. webrtcvad-wheels is the
    # same code with binary wheels, importing as the identical module.
    "webrtcvad>=2.0.10 ; sys_platform != 'win32'",
    "webrtcvad-wheels>=2.0.10 ; sys_platform == 'win32'",
]

[tool.setuptools]
packages = ["backtalk"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.16.10",
]

# The lint gate. Deliberately error-level only -- syntax errors,
# undefined names, `break` outside a loop, unused imports -- because
# this codebase has its own voice and a style linter would fight it.
# Run: uv run ruff check backtalk tests
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E9",     # syntax errors
    "F401",   # unused import
    "F63",    # assertion/tuple bugs
    "F7",     # break/continue/yield outside loop, print debug leftovers
    "F81",    # redefinition
    "F82",    # undefined name in __all__
    "F821",   # undefined name
    "F822",   # undefined name in __all__
    "F823",   # local variable referenced before assignment
]

# The type gate. Basic mode, not strict: this code leans on duck-typed
# audio/ML libraries and would drown in strict-mode noise. The point is
# to catch the mistakes a linter cannot -- a wrong attribute, a None that
# is not checked, a return that can miss a path.
# Run: uv run pyright
[tool.pyright]
include = ["backtalk"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# sounddevice, webrtcvad, faster-whisper and kokoro ship no type
# information. That is not a mistake in our code, so a missing stub is
# not a gate failure -- but a real error in OUR code still is.
reportMissingTypeStubs = false
reportMissingModuleSource = false

